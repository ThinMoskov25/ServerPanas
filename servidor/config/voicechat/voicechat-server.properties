# Simple Voice Chat - configuracion de servidor para exaroton
#
# port = -1 hace que el chat de voz use el MISMO puerto que el
# servidor de Minecraft (23574) en vez de abrir el 24454 aparte.
#
# Es obligatorio en exaroton: solo dan UN puerto por servidor, asi
# que no se puede usar el puerto por defecto del mod.
# https://support.exaroton.com/hc/en-us/articles/360019857998-Installing-Voice-Chat-Mods-Minecraft-Java-Edition
port=-1

# Distancia en bloques a la que se oye a otro jugador
max_voice_distance=48.0

# Calidad del audio. 'voip' es el equilibrio normal.
codec=VOIP

# Permitir que los jugadores se oigan solo si estan cerca
# (false = chat de proximidad, que es lo que queremos)
open_groups=false
